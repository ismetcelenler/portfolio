<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0e0f13">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Jump Jump</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #0e0f13; color: #e8e8e8; font-family: 'VT323', monospace;
    overflow: hidden; overscroll-behavior: none; touch-action: none;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  body { position: fixed; inset: 0; }
  canvas { display: block; position: absolute; inset: 0; width: 100%; height: 100%; }
  #hud { position: absolute; left: calc(16px + env(safe-area-inset-left)); top: calc(10px + env(safe-area-inset-top)); pointer-events: none; }
  #score { font-size: 48px; line-height: 1; }
  #best { font-size: 20px; opacity: .6; }
  #pop { position: absolute; left: 50%; top: 28%; transform: translate(-50%, -50%); font-size: 36px;
    pointer-events: none; opacity: 0; transition: opacity .2s; color: #ffd93d; white-space: nowrap; }
  #msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 30px; pointer-events: none; text-align: center; line-height: 1.1; padding: 0 16px; }
  #msg small { font-size: 20px; opacity: .7; }
  .dugmeler { position: absolute; right: calc(10px + env(safe-area-inset-right)); top: calc(10px + env(safe-area-inset-top));
    display: flex; gap: 8px; }
  .dugmeler button { width: 44px; height: 44px; border: 1px solid #2a2d38; border-radius: 10px; background: rgba(14,15,19,.7);
    color: #e8e8e8; font: 26px/1 'VT323', monospace; cursor: pointer; padding: 0; touch-action: manipulation; }
  .dugmeler button:focus-visible { outline: 2px solid #4d96ff; outline-offset: 2px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="hud"><div id="score">0</div><div id="best">REKOR 0</div></div>
<div id="pop"></div>
<div id="msg"></div>
<div class="dugmeler">
  <button id="tamEkran" type="button" aria-label="Tam ekran" hidden>&#x26F6;</button>
  <button id="kapat" type="button" aria-label="Oyunu kapat">&#x2715;</button>
</div>
<script src="core.js"></script>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const gomulu = window.parent !== window;   // portföyün tam ekran katmanında mı?
const g = JJ.create();
JJ.attachHud(g);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
document.body.prepend(renderer.domElement);
JJ.bindInput(g, renderer.domElement);

// --- Kapat ve tam ekran ---
function kapat() {
  if (gomulu) parent.postMessage('oyun-kapat', location.origin);
  else location.href = '../';
}
document.getElementById('kapat').addEventListener('click', kapat);
addEventListener('keydown', (e) => { if (e.key === 'Escape' && !document.fullscreenElement) kapat(); });
const tamEkran = document.getElementById('tamEkran');
if (!gomulu && document.fullscreenEnabled) {
  tamEkran.hidden = false;
  tamEkran.addEventListener('click', () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  });
}
// Katmanda açılınca Space tuşu hemen çalışsın
addEventListener('load', () => window.focus());

// --- Sahne ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e0f13);
const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 100);
const CAM_OFF = new THREE.Vector3(-10, 12, -10);

scene.add(new THREE.HemisphereLight(0xffffff, 0x2a3040, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12, near: 0.5, far: 40 });
scene.add(sun, sun.target);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.ShadowMaterial({ opacity: 0.35 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Dikey telefonda daha geniş alan göster ki bir sonraki platform ekrana sığsın
function resize() {
  const w = innerWidth, h = innerHeight, a = w / h;
  renderer.setSize(w, h, false);
  const V = a < 0.6 ? 15 : a < 0.9 ? 13 : 9;
  cam.left = -V * a / 2; cam.right = V * a / 2; cam.top = V / 2; cam.bottom = -V / 2;
  cam.updateProjectionMatrix();
}
addEventListener('resize', resize);
if (window.visualViewport) visualViewport.addEventListener('resize', resize);
resize();

// --- Platformlar ---
const meshes = new Map();
function addPlat(p) {
  const geo = new THREE.BoxGeometry(p.w, g.PLAT_H, p.w).translate(0, g.PLAT_H / 2, 0);
  const m = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ color: p.color }));
  m.castShadow = m.receiveShadow = true;
  m.position.set(p.x, 0, p.z);
  m.userData = { plat: p, born: 0 };
  scene.add(m);
  meshes.set(p.id, m);
}
function removePlat(p) {
  const m = meshes.get(p.id);
  if (!m) return;
  scene.remove(m); m.geometry.dispose(); m.material.dispose();
  meshes.delete(p.id);
}

// --- Oyuncu: gövde + kafa, pivot gövdenin ortasında (takla için) ---
const player = new THREE.Group();
const pmat = new THREE.MeshLambertMaterial({ color: 0x2b2d42 });
const body = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.28, 0.6, 16), pmat);
body.position.y = -0.15;
const head = new THREE.Mesh(new THREE.SphereGeometry(0.2, 16, 12), pmat);
head.position.y = 0.33;
[body, head].forEach((o) => { o.castShadow = true; player.add(o); });
const PIVOT = 0.45;
scene.add(player);

// --- Parçacıklar ---
const parts = [];
const pgeo = new THREE.BoxGeometry(0.12, 0.12, 0.12);
function burst(x, z, color, n) {
  for (let i = 0; i < n; i++) {
    const m = new THREE.Mesh(pgeo, new THREE.MeshBasicMaterial({ color }));
    m.position.set(x, g.PLAT_H + 0.1, z);
    const a = Math.random() * Math.PI * 2, s = 2 + Math.random() * 3;
    m.userData = { vx: Math.cos(a) * s, vz: Math.sin(a) * s, vy: 4 + Math.random() * 4, life: 0.7 };
    scene.add(m); parts.push(m);
  }
}

let shake = 0;
g.on((e) => {
  if (e.type === 'reset') { [...meshes.values()].forEach((m) => removePlat(m.userData.plat)); }
  if (e.type === 'spawn') addPlat(e.plat);
  if (e.type === 'remove') removePlat(e.plat);
  if (e.type === 'land') {
    burst(e.x, e.z, e.perfect ? 0xffd93d : 0xffffff, e.perfect ? 16 : 6);
    if (e.perfect) shake = 0.12;
    if (e.perfect && navigator.vibrate) navigator.vibrate(12);
  }
  if (e.type === 'fall') shake = 0.2;
});

g.reset();

// --- Döngü: sekme gizliyken durur, dönüşte zaman sıçramaz ---
const q = new THREE.Quaternion(), axis = new THREE.Vector3(), target = new THREE.Vector3();
let last = performance.now();
document.addEventListener('visibilitychange', () => { last = performance.now(); });
function frame(now) {
  requestAnimationFrame(frame);
  if (document.hidden) return;
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
  last = now;
  g.update(dt);

  meshes.forEach((m) => {
    const u = m.userData;
    u.born = Math.min(1, u.born + dt * 4);
    m.position.y = (1 - u.born) * (1 - u.born) * 3;
    m.scale.y = u.plat.squash;
  });

  const p = g.player;
  player.position.set(p.x, p.y + PIVOT * p.sq, p.z);
  player.scale.set(1 + (1 - p.sq) * 0.6, p.sq, 1 + (1 - p.sq) * 0.6);
  axis.set(p.dz, 0, -p.dx).normalize();
  player.quaternion.copy(q.setFromAxisAngle(axis, p.rot));

  for (let i = parts.length - 1; i >= 0; i--) {
    const m = parts[i], u = m.userData;
    u.life -= dt; u.vy -= 18 * dt;
    m.position.x += u.vx * dt; m.position.y += u.vy * dt; m.position.z += u.vz * dt;
    m.scale.setScalar(Math.max(0.01, u.life / 0.7));
    if (u.life <= 0) { scene.remove(m); m.material.dispose(); parts.splice(i, 1); }
  }

  shake = Math.max(0, shake - dt);
  target.set(g.cam.x + (Math.random() - 0.5) * shake * 2, 0, g.cam.z + (Math.random() - 0.5) * shake * 2);
  cam.position.copy(target).add(CAM_OFF);
  cam.lookAt(target);
  sun.position.set(target.x - 3, 12, target.z + 4);
  sun.target.position.copy(target);

  renderer.render(scene, cam);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
